events {}

http {
  include       mime.types;
  default_type  application/octet-stream;

  upstream backend_server {
    server app:8080;
    keepalive 32;  # 백엔드와 연결 재사용 (성능↑)
  }

  server {
      listen 80;
      server_name daily-ootd.online;
      return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name daily-ootd.online;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 공통 타임아웃 (API 기준)
    proxy_connect_timeout 10s;   # 백엔드 연결 시도 제한
    proxy_send_timeout    20s;   # 요청 바디 전송 제한
    proxy_read_timeout    20s;   # 응답 대기 제한
    send_timeout          20s;   # 클라이언트로 응답 전송 제한
    keepalive_timeout     20s;   # 클라이언트와 연결 유지 시간

    location ^~ /api/sse {
      proxy_pass http://backend_server/api/sse;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Content-Type text/event-stream;
      proxy_set_header X-Accel-Buffering 'no';  # Disable Nginx buffering
      proxy_buffering off;                      # Disable response buffering completely
      proxy_http_version 1.1;

      # SSE 스트리밍용 (장시간 연결 허용)
      proxy_read_timeout 1h;
    }

    location ^~ /api/ {
      proxy_pass http://backend_server/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /ws/ {
      proxy_pass http://backend_server/ws/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_http_version 1.1;

      # WebSocket 장시간 연결 허용
      proxy_read_timeout 1h;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
    }
  }
}
